[package]
name = "kk-storage-bench"
description = "使用合成房间快照、玩家记录和大字节块比较 redb 与 libmdbx 的存储基准"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
kk-core.workspace = true
kk-schema.workspace = true
kk-world.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# 引擎为可选依赖，默认构建不编译存储引擎，仍可检查接口、夹具和统计代码。
# 启用 libmdbx 需要原生编译工具及 bindgen 使用的 libclang。运行命令见 crate 文档。
redb = { workspace = true, optional = true }
libmdbx = { workspace = true, optional = true }

[features]
default = []
redb = ["dep:redb"]
libmdbx = ["dep:libmdbx"]
