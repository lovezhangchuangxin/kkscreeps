name: CI

# 分别检查 Rust、JavaScript、文档链接和完整 screeps-ok 回归套件。
# pnpm run check 覆盖常规检查；完整兼容性套件需另运行 compat/scripts/ratchet.mjs。

on:
  # 只对 main 响应 push；其他分支通过 pull_request 检查，避免一次更新触发两套任务。
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 与 rust-toolchain.toml 保持同一版本，将 rustfmt/clippy 安装到实际使用的工具链。
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 格式化检查
        run: cargo fmt --all --check
      - name: 静态检查
        run: cargo clippy --workspace --all-targets
      - name: 单元测试
        run: cargo test --workspace
      - name: 构建引擎二进制
        run: cargo build -p kk-cli
      - name: 构建适配器 dist
        run: pnpm --filter @kkscreeps/compat run build
      - name: 适配器冒烟（embed RPC 端到端）
        run: node --test compat/test/smoke.test.mjs
        env:
          KKSCREEPS_BIN: target/debug/kkscreeps

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 工作区测试
        run: pnpm -r run test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 文档链接检查
        run: node scripts/check-doc-links.mjs

  # 检查 ratchet.json 中的通过数下限和总用例数，并拒绝基线已通过用例的未豁免回归。
  # 单次 RPC 超时由 compat/src/rpc.ts 处理；整个任务另受 timeout-minutes 限制。
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 读取 HEAD~1 的报告作为逐用例基线，需要保留父提交。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 构建引擎二进制（release）
        run: cargo build --release -p kk-cli
      - name: 准备 screeps-ok 上游（pin 固定）
        run: bash scripts/setup-screeps-ok.sh
      - name: 构建适配器 dist
        run: pnpm --filter @kkscreeps/compat run build
      - name: 通过率棘轮
        run: node compat/scripts/ratchet.mjs
