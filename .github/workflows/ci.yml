name: CI

# 三个 job 对应 roadmap M0 的 CI 条目：格式化/静态检查/单元测试 + 文档链接检查。
# 仓库尚未推远端时，本地等价命令是 `pnpm run check`（根 package.json）。

on:
  # push 限 main：PR 分支的 push 与 pull_request 事件会各跑一遍全部 job
  # （含 ratchet 的 release 构建 + 全量套件），双倍分钟数
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 固定到 rust-toolchain.toml 的同一版本：@stable 会因 toml 自动切工具链，
      # 但 rustfmt/clippy 组件只装在 stable 上，cargo fmt 会报组件缺失
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 格式化检查
        run: cargo fmt --all --check
      - name: 静态检查
        run: cargo clippy --workspace --all-targets
      - name: 单元测试
        run: cargo test --workspace
      - name: 构建引擎二进制
        run: cargo build -p kk-cli
      - name: 构建适配器 dist
        run: pnpm --filter @kkscreeps/compat run build
      - name: 适配器冒烟（embed RPC 端到端）
        run: node --test compat/test/smoke.test.mjs
        env:
          KKSCREEPS_BIN: target/debug/kkscreeps

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 工作区测试
        run: pnpm -r run test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 文档链接检查
        run: node scripts/check-doc-links.mjs

  # M1 验收关卡（roadmap）：通过率棘轮——全量 screeps-ok 套件跑通且 passed 不低于
  # 地板（compat/reports/ratchet.json，唯一真相源）。RPC 超时（compat/src/rpc.ts）
  # 是前置：sidecar 挂死时由卡死变为超时红。
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: 构建引擎二进制（release）
        run: cargo build --release -p kk-cli
      - name: 准备 screeps-ok 上游（pin 固定）
        run: bash scripts/setup-screeps-ok.sh
      - name: 构建适配器 dist
        run: pnpm --filter @kkscreeps/compat run build
      - name: 通过率棘轮
        run: node compat/scripts/ratchet.mjs
