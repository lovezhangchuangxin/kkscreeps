[package]
name = "inspector-spike"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
deno_core = "0.412.0"
deno_inspector_server = "0.33.0"
tokio = { version = "1", features = ["rt", "time"] }
tungstenite = "0.26"
ureq = { version = "2", default-features = false }
serde_json = "1"

[build-dependencies]
deno_core = "0.412.0"

# 独立于根 workspace（与 boa-spike 同款空表）。当前工具链下仅靠根 exclude=["spikes/*"]
# 会报 "believes it's in a workspace when it's not"（deno-spike 同样复现）——见笔记踩坑记录。
[workspace]
